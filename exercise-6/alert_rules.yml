groups:
  - name: delivery_alerts
    rules:
      - alert: HighPendingDeliveries
        expr: pending_deliveries > 10
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: High pending deliveries
          description: Pending deliveries have exceeded 10 for at least 15 seconds.
      - alert: HighAverageDeliveryTime
        expr: rate(average_delivery_time_sum[1m]) / rate(average_delivery_time_count[1m]) > 30
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: High average delivery time
          description: The average observed delivery duration over the last minute has exceeded 30 seconds for at least 15 seconds.
