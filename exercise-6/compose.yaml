name: exercise6
services:
  metrics:
    build:
      context: .
      dockerfile: Dockerfile
    image: exercise6-metrics:lab
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  prometheus:
    build:
      context: .
      dockerfile: prometheus/Dockerfile
    image: exercise6-prometheus:lab
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - metrics
    restart: unless-stopped
  grafana:
    build:
      context: .
      dockerfile: grafana/Dockerfile
    image: exercise6-grafana:lab
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    image: exercise6-jenkins:lab
    user: "0:0"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/lab:ro
    restart: unless-stopped
volumes:
  prometheus_data:
  grafana_data:
  jenkins_home:
